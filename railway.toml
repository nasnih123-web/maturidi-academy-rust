# Railway — service "api" (root directory: repository root)
# Schema: Railway config-as-code (railway.toml). Deploy status: prepared,
# NOT deployed — no Railway account action has been taken for the Rust
# server, and the image has not been built yet (no Docker daemon in this
# workspace; see scripts/cutover-README.md). Mirrors the original
# apps/api/railway.toml shape: DOCKERFILE builder, /health healthcheck.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# $PORT is injected by Railway; the binary reads PORT itself (default 8000).
# Single process per replica; scale with Railway replicas instead of workers.
startCommand = "./maturidi-api-rs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
