[package]
name = "maturidi-api-rs"
version = "0.1.0"
edition = "2021"
description = "Maturidi Academy API server, rewritten in Rust (Axum front door, Wave 1)"
license = "MIT"

[[bin]]
name = "maturidi-api-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", features = ["any", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring", "chrono", "uuid", "json"] }
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
# Wave 9 PR-3 — real mail/SMS (ADR-158): lettre for SMTP, futures-util
# for the sidecar forwarder's capped body read (routes_lift.rs).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls", "builder"] }
futures-util = "0.3"
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
unicode-normalization = "0.1"
# Wave 2 — auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
# Wave 9 PR-3 — the SSE streaming test builds its mock sidecar from
# `futures_util::stream::unfold` (no async-stream crate).
futures-util = "0.3"
